name: Production quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type, lint, test, build, and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/secrets-scan.mjs
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-report.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            secrets-scan-report.json
            bundle-analysis-report.json
          if-no-files-found: ignore
          retention-days: 14

  mobile-e2e:
    name: Mobile client journey
    # Playwright 1.56 cannot install Chromium on the current ubuntu-latest (26.04) image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
