name: Deployment smoke check

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS URL of an already-created Vercel preview or production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deployment URL
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo 'deployment_url must begin with https://'; exit 1 ;;
          esac
      - name: Check public pages and liveness endpoints
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -eu
          for path in / /guide /faq /privacy /terms /disclosures /api/health /api/healthz; do
            curl --fail --silent --show-error --location "$DEPLOYMENT_URL$path" > /dev/null
            echo "Passed $path"
          done
      - name: Confirm a non-allowlisted API fails closed
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/api/legacy-endpoint")
          test "$status" = '404'
      - name: Publish smoke-test summary
        run: echo 'Deployment smoke checks passed.' >> "$GITHUB_STEP_SUMMARY"
