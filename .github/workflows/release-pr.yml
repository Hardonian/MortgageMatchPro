name: Release candidate validation

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit, branch, or tag to validate
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/secrets-scan.mjs
      - run: npm run api:verify
      - run: npm run config:verify
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-report.mjs --check
      - name: Publish validation summary
        run: |
          {
            echo '## Release candidate validated'
            echo ''
            echo "- Ref: \`${{ inputs.release_ref }}\`"
            echo '- Code-only checks passed; production promotion remains subject to the launch gates.'
          } >> "$GITHUB_STEP_SUMMARY"
