name: Autonomous Regression Watchers

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      watcher_type:
        description: 'Type of watcher to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - db_integrity
          - api_contract
          - ai_performance

env:
  NODE_VERSION: '18'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  db-integrity-watcher:
    name: Database Integrity Watcher
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watcher_type == 'all' ||
      github.event.inputs.watcher_type == 'db_integrity'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Integrity Check
        run: npx tsx watchers/db_integrity.watcher.ts
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

  api-contract-watcher:
    name: API Contract Watcher
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watcher_type == 'all' ||
      github.event.inputs.watcher_type == 'api_contract'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Contract Check
        run: npx tsx watchers/api_contract.watcher.ts
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

  ai-performance-watcher:
    name: AI Performance Watcher
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.watcher_type == 'all' ||
      github.event.inputs.watcher_type == 'ai_performance'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Performance Check
        run: npx tsx watchers/ai_performance.watcher.ts
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

  notify-watcher-results:
    name: Notify Watcher Results
    runs-on: ubuntu-latest
    needs: [db-integrity-watcher, api-contract-watcher, ai-performance-watcher]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate Watcher Summary
        id: generate-summary
        run: |
          SUMMARY=$(node -e "
          const results = {
            db_integrity: '${{ needs.db-integrity-watcher.result }}',
            api_contract: '${{ needs.api-contract-watcher.result }}',
            ai_performance: '${{ needs.ai-performance-watcher.result }}'
          };
          const summary = {
            timestamp: new Date().toISOString(),
            db_integrity: results.db_integrity,
            api_contract: results.api_contract,
            ai_performance: results.ai_performance,
            issues: Object.entries(results)
              .filter(([, v]) => v === 'failure')
              .map(([k]) => k + ' watcher failed'),
            recommendations: Object.entries(results)
              .filter(([, v]) => v === 'failure')
              .map(([k]) => 'Investigate ' + k + ' watcher failure')
          };
          process.stdout.write(JSON.stringify(summary));
          ")
          echo "WATCHER_SUMMARY=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" | node -e "process.stdin.resume(); let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)))"

      - name: Create Summary Issue
        if: >-
          needs.db-integrity-watcher.result == 'failure' ||
          needs.api-contract-watcher.result == 'failure' ||
          needs.ai-performance-watcher.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryText = process.env.WATCHER_SUMMARY || '{}';
            const parsed = JSON.parse(summaryText);

            const issueBody = `## 🔍 Autonomous Watcher Report

            **Generated:** ${new Date().toISOString()}

            ### Watcher Results
            - **Database Integrity:** ${parsed.db_integrity || 'unknown'}
            - **API Contract:** ${parsed.api_contract || 'unknown'}
            - **AI Performance:** ${parsed.ai_performance || 'unknown'}

            ### Issues Found
            ${(parsed.issues || []).map(issue => `- ${issue}`).join('\n') || 'No issues detected'}

            ### Recommendations
            ${(parsed.recommendations || []).map(rec => `- ${rec}`).join('\n') || 'No recommendations'}

            ---
            *This report was generated by the Autonomous Watcher system.*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Watcher Report - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['watcher-report', 'automated', 'regression']
            });
        env:
          WATCHER_SUMMARY: ${{ steps.generate-summary.outputs.WATCHER_SUMMARY }}
