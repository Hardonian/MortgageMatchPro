<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e29" />
      <stop offset="60%" stop-color="#0a2b38" />
      <stop offset="100%" stop-color="#0e3848" />
    </linearGradient>
    <radialGradient id="glowMint" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(168,242,205,0.25)" />
      <stop offset="100%" stop-color="rgba(168,242,205,0)" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="rgba(80,180,240,0.2)" />
      <stop offset="100%" stop-color="rgba(80,180,240,0)" />
    </radialGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="864" fill="url(#heroBg)" />
  <rect width="1536" height="864" fill="url(#glowMint)" />
  <rect width="1536" height="864" fill="url(#glowBlue)" />

  <!-- Left: Copy & Branding -->
  <g transform="translate(100, 180)">
    <!-- Pill Badge -->
    <rect width="250" height="42" rx="21" fill="rgba(168,242,205,0.15)" stroke="rgba(168,242,205,0.4)" stroke-width="1.5" />
    <text x="24" y="27" fill="#a8f2cd" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="0.5">✦ AI-POWERED INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="125" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="62" letter-spacing="-2">Smarter Mortgages</text>
    <text x="0" y="195" fill="#a8f2cd" font-family="Georgia, serif" font-weight="400" font-style="italic" font-size="62" letter-spacing="-1">Start Here.</text>

    <!-- Subtitle -->
    <text x="0" y="260" fill="#a0b8c0" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" width="550">
      <tspan x="0" dy="0">Instant, private buying power analysis and verified</tspan>
      <tspan x="0" dy="32">stress-tested rate scenarios for confident home buying.</tspan>
    </text>

    <!-- Trust Badges -->
    <g transform="translate(0, 370)">
      <rect width="170" height="44" rx="12" fill="rgba(255,255,255,0.08)" />
      <text x="20" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">✓ OSFI / CFPB Safe</text>

      <rect x="185" width="165" height="44" rx="12" fill="rgba(255,255,255,0.08)" />
      <text x="205" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">🔒 100% Private</text>
    </g>
  </g>

  <!-- Right: Glassmorphic App Mockup Card -->
  <g transform="translate(850, 140)" filter="url(#glassShadow)">
    <!-- Card Frame -->
    <rect width="580" height="600" rx="32" fill="#092632" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="40" y="65" fill="#a7bec3" font-family="Inter, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">PLANNING SCENARIO</text>
    <text x="40" y="125" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5">$3,418<tspan font-size="20" fill="#a7bec3"> /mo</tspan></text>

    <line x1="40" y1="165" x2="540" y2="165" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- Metric Columns -->
    <g transform="translate(40, 200)">
      <text x="0" y="0" fill="#9fb5ba" font-family="Inter, sans-serif" font-size="13">Est. Buying Power</text>
      <text x="0" y="30" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="22">$762,000</text>

      <text x="260" y="0" fill="#9fb5ba" font-family="Inter, sans-serif" font-size="13">Stress-Test Rate</text>
      <text x="260" y="30" fill="#a8f2cd" font-family="Inter, sans-serif" font-weight="700" font-size="22">6.79%</text>
    </g>

    <!-- Sub Card: Comparison -->
    <g transform="translate(40, 290)">
      <rect width="500" height="150" rx="20" fill="#061e29" stroke="rgba(168,242,205,0.2)" stroke-width="1" />
      <rect x="24" y="24" width="80" height="26" rx="8" fill="rgba(168,242,205,0.18)" />
      <text x="36" y="42" fill="#a8f2cd" font-family="Inter, sans-serif" font-weight="700" font-size="11">STEADY</text>

      <text x="24" y="85" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="18">5-Year Fixed Conventional</text>
      <text x="24" y="112" fill="#889ea4" font-family="Inter, sans-serif" font-size="13">Clear monthly cashflow with zero rate volatility</text>

      <text x="380" y="90" fill="#a8f2cd" font-family="Inter, sans-serif" font-weight="800" font-size="26">4.79%</text>
    </g>

    <!-- Call to action button inside mockup -->
    <g transform="translate(40, 485)">
      <rect width="500" height="60" rx="16" fill="#a8f2cd" />
      <text x="180" y="37" fill="#092632" font-family="Inter, sans-serif" font-weight="750" font-size="16">Calculate Your Plan →</text>
    </g>
  </g>
</svg>
